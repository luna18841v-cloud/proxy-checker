<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proxy Checker</title>
<style>
  :root{--bg:#fff0f7;--card:#fff;--ln:#ffc9e3;--ln2:#ffe0ee;--tx:#4a1230;--dm:#a8658a;--ac:#e0358f;--ac2:#ff5cae;--ok:#12a594;--okbg:#d3f5ef;--oktx:#0b7a6d;--bad:#e03131;--badbg:#ffe0e0;--badtx:#b02525;--un:#e8890c;--unbg:#fff0d4;--untx:#9a5b06}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(500px 240px at 15% 0%,#ffd9ec,transparent 70%),radial-gradient(500px 240px at 85% 0%,#d9f2ff,transparent 70%),var(--bg);color:var(--tx);font:14px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{background:linear-gradient(90deg,#ff5cae,#e0358f);padding:16px 20px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;color:#fff}
  h1{font-size:18px;margin:0;font-weight:900;letter-spacing:.8px}
  header small{color:#ffe3f1;font-size:11.5px}
  main{padding:18px 20px 80px;max-width:1180px;margin:0 auto}
  .panel{background:var(--card);border:2px solid var(--ln);border-radius:20px;padding:14px;margin-bottom:16px;box-shadow:0 8px 22px rgba(224,53,143,.14)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  label{display:block;font-size:11px;color:var(--dm);text-transform:uppercase;letter-spacing:.7px;margin-bottom:5px;font-weight:800}
  textarea,input,select{background:#fffafd;border:2px solid var(--ln);color:var(--tx);border-radius:14px;padding:8px;font:inherit;width:100%}
  textarea{min-height:120px;resize:vertical}
  .f{flex:1 1 180px;min-width:140px}
  .f.sm{flex:0 0 110px}
  button{background:#ffe0ee;border:2px solid #ffb8da;color:#a01e63;padding:9px 18px;border-radius:999px;font:inherit;font-weight:800;cursor:pointer;transition:.15s}
  button:hover{background:#ffcde5;box-shadow:0 3px 12px rgba(224,53,143,.25)}
  button.primary{background:linear-gradient(180deg,#ff5cae,#d92f88);border-color:transparent;color:#fff;box-shadow:0 5px 16px rgba(217,47,136,.4)}
  button.primary:hover{filter:brightness(1.08)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .bar{height:8px;background:var(--ln2);border-radius:5px;overflow:hidden;margin:0 0 10px}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff5cae,#12a594);transition:width .2s}
  .stats{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--dm)}
  .stats b{color:var(--tx);font-variant-numeric:tabular-nums}
  .hint{font-size:11px;color:var(--dm);margin-top:6px}
  .picks{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
  .picks label{display:inline-flex;gap:7px;align-items:center;text-transform:none;font-size:12.5px;color:#a01e63;margin:0;font-weight:800;background:#ffe0ee;border:2px solid #ffb8da;border-radius:999px;padding:8px 16px;cursor:pointer}
  .picks input{width:auto;margin:0;accent-color:#e0358f}
  .dlrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .dlrow button{padding:7px 14px;font-size:12px}
  .empty{text-align:center;color:var(--dm);font-size:13px;padding:34px 10px;border:2px dashed var(--ln);border-radius:20px;background:var(--card)}

  .item{background:var(--card);border:2px solid var(--ln);border-radius:16px;padding:10px 12px;margin-bottom:10px}
  .ihead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px}
  .pv{font-weight:800;word-break:break-all;font-family:ui-monospace,Menlo,Consolas,monospace}
  .vd{font-size:10.5px;font-weight:900;padding:1px 9px;border-radius:999px;text-transform:uppercase}
  .vd.pass{background:var(--okbg);color:var(--oktx)}
  .vd.fail{background:var(--badbg);color:var(--badtx)}
  .vd.unk{background:var(--unbg);color:var(--untx)}
  .vd.dead{background:var(--ln2);color:var(--dm)}
  .pip{font-size:11px;color:var(--dm);font-family:ui-monospace,Menlo,Consolas,monospace}
  .src{font-size:10px;color:var(--oktx)}
  .src.b{color:var(--dm)}
  .secs{margin-left:auto;font-size:11px;color:var(--dm)}
  .idet{margin-top:7px;display:flex;gap:4px 14px;flex-wrap:wrap;font-size:12px;color:var(--dm)}
  .kv b{font-weight:800}
  .kv b.y{color:var(--bad)}
  .kv b.n{color:var(--ok)}
  .lnk{color:#d92f88;text-decoration:underline}
</style>
</head>
<body>
<header>
  <h1>PROXY CHECKER</h1>
  <small>Theme: Bubblegum — PASS = VPN No · Datacenter No · AnonymousProxy No · LastSeen খালি/0/- · Fraud &lt; 20</small>
</header>

<main>
  <div class="panel">
    <div class="row">
      <div class="f" style="flex:1 1 100%">
        <label>প্রক্সি লিস্ট — host:port | user:pass@host:port | host:port:user:pass | socks5://…</label>
        <textarea id="proxies" spellcheck="false" placeholder="1.2.3.4:8080&#10;user:pass@5.6.7.8:3128&#10;socks5://9.9.9.9:1080"></textarea>
      </div>
    </div>
    <div class="row" style="margin-top:12px">
      <div class="f sm"><label>ফাইল</label><input type="file" id="file" accept=".txt,.csv"></div>
      <div class="f" style="flex:2 1 320px"><label>Worker URL (খালি = সরাসরি ফেচ)</label><input id="worker" placeholder="https://&lt;your-worker&gt;.workers.dev"></div>
      <div class="f sm"><label>Concurrency</label><input id="conc" type="number" min="1" max="500" value="40"></div>
      <div class="f sm"><label>Timeout (s)</label><input id="timeout" type="number" min="4" max="20" value="8"></div>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="primary" id="start">শুরু</button>
      <button id="stop" disabled>থামাও</button>
      <button id="clear">রিসেট</button>
      <button id="test">ফাংশন টেস্ট</button>
      <span class="hint" id="parsed"></span>
    </div>
  </div>

  <div class="panel">
    <div class="bar"><i id="prog"></i></div>
    <div class="stats">
      <span>প্রগতি <b id="s-done">0/0</b></span>
      <span>PASS <b id="s-pass">0</b></span>
      <span>FAIL <b id="s-fail">0</b></span>
      <span>UNK <b id="s-unk">0</b></span>
      <span>DEAD <b id="s-dead">0</b></span>
      <span>ERR <b id="s-err">0</b></span>
      <span>ResProxy YES <b id="s-resy">0</b></span>
      <span>ResProxy NO <b id="s-resn">0</b></span>
      <span>Cable/DSL <b id="s-cable">0</b></span>
      <span>Cellular <b id="s-cell">0</b></span>
      <span>গতি <b id="s-rate">0</b>/মিনিট</span>
      <span>429 <b id="s-429">0</b></span>
      <span>সময় <b id="s-el">0s</b></span>
    </div>
    <div class="dlrow">
      <button id="dl-csv">all.csv</button>
      <button id="dl-good">good.txt</button>
      <button id="dl-cable">good_cable_dsl.txt</button>
      <button id="dl-cell">good_cellular.txt</button>
      <button id="dl-resyes">res_yes.txt</button>
      <button id="dl-resno">res_no.txt</button>
    </div>
    <div class="picks">
      <label><input type="checkbox" id="res-yes"> Residential Proxy YES</label>
      <label><input type="checkbox" id="res-no"> Residential Proxy NO</label>
      <button id="dl-res">residential.txt</button>
      <span class="hint" id="rescount"></span>
    </div>
  </div>

  <div id="empty" class="empty">লিস্ট বসিয়ে <b>শুরু</b> চাপুন — ফলাফল এখানে আসবে।</div>
  <div id="list"></div>
</main>

<script src="/app.js" defer></script>
</body>
</html>
